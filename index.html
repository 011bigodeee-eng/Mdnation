    <style>
      html.md-intro-running {
        overflow: hidden;
        scrollbar-gutter: stable;
      }
      html.md-intro-running body {
        overflow: hidden;
      }
      html.md-intro-pending {
        background: #000;
      }
      html.md-intro-pending body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: #000;
        z-index: 10000;
      }
      html.md-intro-pending #md-site-content {
        visibility: hidden;
      }
    </style>
    <script>
      (function () {
        var root = document.documentElement;
        window.__mdIntroRelease = function () {
          clearTimeout(window.__mdIntroWatchdog);
          root.classList.remove("md-intro-pending", "md-intro-running");
          try {
            sessionStorage.setItem("mdnation:intro:seen", "1");
          } catch (e) {}
          var content = document.getElementById("md-site-content");
          if (content) content.inert = false;
          window.dispatchEvent(new Event("md-intro-release"));
        };
        try {
          if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
          var seen = false;
          try {
            seen = !!sessionStorage.getItem("mdnation:intro:seen");
          } catch (e) {}
          if (seen) return;
          root.classList.add("md-intro-pending", "md-intro-running");
          window.__mdIntroWatchdog = setTimeout(window.__mdIntroRelease, 2000);
        } catch (e) {
          root.classList.remove("md-intro-pending", "md-intro-running");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
